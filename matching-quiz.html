<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home Matching Quiz</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="site-header">
        <div class="header-inner">

            <div class="logo-area">
                <h1>
                    <a href="index.html">
                    <img src="/images/zillow-logo.png" class="logo" alt="Zillow Logo">
                    </a>
                </h1>
            </div>

        </div>
    </header>
<div class="container">
    <h1>Home Matching Quiz</h1>

    <!-- BASIC HOME SPECS -->
    <div class="section-title-quiz">Basic Home Preferences</div>
    <div class="grid-quiz">
        <div class="card-quiz">
            <label>Number of Bedrooms</label>
            <select>
                <option value="">Select...</option>
                <option>1+</option>
                <option>2+</option>
                <option>3+</option>
                <option>4+</option>
                <option>5+</option>
            </select>
        </div>

        <div class="card-quiz">
            <label>Number of Bathrooms</label>
            <select>
                <option value="">Select...</option>
                <option>1+</option>
                <option>2+</option>
                <option>3+</option>
                <option>4+</option>
            </select>
        </div>

        <div class="card-quiz">
    <label>Square Footage Range</label>

    <div class="range-container">
        <input type="range" id="sqftMin" min="500" max="6000" step="50" value="800">
        <input type="range" id="sqftMax" min="500" max="6000" step="50" value="2500">

        <div class="range-values">
            <span id="sqftMinValue">800 sq ft</span>
            <span id="sqftMaxValue">2500 sq ft</span>
        </div>
    </div>
</div>

        <div class="card-quiz">
    <label>Price Range</label>

    <div class="range-container">
        <input type="range" id="priceMin" min="50000" max="2000000" step="50000" value="200000">
        <input type="range" id="priceMax" min="50000" max="2000000" step="50000" value="800000">

        <div class="range-values">
            <span id="priceMinValue">$100,000</span>
            <span id="priceMaxValue">$3,000,000</span>
        </div>
    </div>
</div>

        <div class="card-quiz">
            <label>ZIP Code</label>
            <input type="text" placeholder="e.g., 16801">
        </div>
    </div>

    <!-- FILTERS -->
    <div class="section-title-quiz">Additional Filters</div>
    <div class="grid-quiz">
        <div class="card-quiz">
            <label>Outdoor Features</label>
            <div class="checkbox-group">
                <label><input type="checkbox"> Pool</label>
                <label><input type="checkbox"> Waterfront</label>
                <label><input type="checkbox"> Large Yard</label>
                <label><input type="checkbox"> Deck / Patio</label>
            </div>
        </div>

        <div class="card-quiz">
            <label>Home Features</label>
            <div class="checkbox-group">
                <label><input type="checkbox"> Garage</label>
                <label><input type="checkbox"> Fireplace</label>
                <label><input type="checkbox"> Central Air</label>
                <label><input type="checkbox"> Finished Basement</label>
            </div>
        </div>

        <div class="card-quiz">
            <label>Community Preferences</label>
            <div class="checkbox-group">
                <label><input type="checkbox"> Walkable Area</label>
                <label><input type="checkbox"> Quiet Neighborhood</label>
                <label><input type="checkbox"> Near Schools</label>
                <label><input type="checkbox"> Pet Friendly</label>
            </div>
        </div>
    </div>
    <nav>
        <a href="home-matching.html" class="nav-link">
    <button id="submitQuiz">See Matches</button>

<script>
</script>
        </a>
    </nav>
</div>

</body>
</html>

<script>
    function formatMoney(num) {
        return "$" + Number(num).toLocaleString();
    }

    // PRICE RANGE
    const priceMin = document.getElementById("priceMin");
    const priceMax = document.getElementById("priceMax");
    const priceMinValue = document.getElementById("priceMinValue");
    const priceMaxValue = document.getElementById("priceMaxValue");

    priceMin.oninput = () => {
        if (parseInt(priceMin.value) > parseInt(priceMax.value)) {
            priceMin.value = priceMax.value;
        }
        priceMinValue.textContent = formatMoney(priceMin.value);
    };

    priceMax.oninput = () => {
        if (parseInt(priceMax.value) < parseInt(priceMin.value)) {
            priceMax.value = priceMin.value;
        }
        priceMaxValue.textContent = formatMoney(priceMax.value);
    };

    // SQFT RANGE
    const sqftMin = document.getElementById("sqftMin");
    const sqftMax = document.getElementById("sqftMax");
    const sqftMinValue = document.getElementById("sqftMinValue");
    const sqftMaxValue = document.getElementById("sqftMaxValue");

    sqftMin.oninput = () => {
        if (parseInt(sqftMin.value) > parseInt(sqftMax.value)) {
            sqftMin.value = sqftMax.value;
        }
        sqftMinValue.textContent = sqftMin.value + " sq ft";
    };

    sqftMax.oninput = () => {
        if (parseInt(sqftMax.value) < parseInt(sqftMin.value)) {
            sqftMax.value = sqftMin.value;
        }
        sqftMaxValue.textContent = sqftMax.value + " sq ft";
    };
</script>
