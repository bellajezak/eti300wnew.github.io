<!DOCTYPE html> 
<html> 
<head> 
    <meta charset="UTF-8">
    <title>Matching Page</title>    
    <link rel="stylesheet" href="styles.css">
</head>      

<body>

    <header class="site-header">    <!-- starts header section -->
    <div class="header-inner">
    
        <nav class="main-nav">    <!-- add nav headers-->
            <a href="index.html" class="nav-link">Buy</a>
            <a href="index.html" class="nav-link">Rent</a>
            <a href="index.html" class="nav-link">Sell</a>
            <a href="index.html" class="nav-link">Get a Mortgage</a>
            <a href="index.html" class="nav-link">Find an Agent</a>
        </nav>

        <div class="logo-area">     <!-- insert zillow logo -->
            <h1>
                <img src="/images/zillow-logo.png" class="logo" alt="Zillow Logo"> 
            </h1>
        </div> 

        <div class="header-right">     <!-- right side headers-->
            <a href="matching-quiz.html" class="nav-link highlight active-page">Home Matching</a>
            <a href="sign-in.html" class="nav-link sign-in-btn">Sign In</a> <!-- sign in button -->
        </div>
    </div>
</header> <!-- end header section -->

    <main class="matching-main">
    <h1 class="matching-title">Your Home Matches</h1>

    <div class="swipe-container">
        <div id="swipe-card" class="card">
            <p id="progress-indicator" class="progress-indicator"></p>
            <img id="home-image" src="" alt="Home">

            <h2 id="home-address"></h2>
            <p id="home-price"></p>

            <div id="home-details" class="home-details">
                <div class="detail-item"><strong>Beds:</strong> <span id="home-beds"></span></div>
                <div class="detail-item"><strong>Baths:</strong> <span id="home-baths"></span></div>
                <div class="detail-item"><strong>Location:</strong> <span id="home-location"></span></div>
            </div>

            <div class="buttons">
                <button id="dislike-btn">❌</button>
                <button id="like-btn">❤️</button>
            </div>

        </div>
    </div>
</main>

    <!-- ⭐ THIS is where your script belongs -->
    <script src="swipe.js"></script>

</body>
</html>
